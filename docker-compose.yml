# Kockolov with Docker Compose (see deploy/myvesta/README.md for the kockolov.rs server):
#   cp .env.example .env   # fill in passwords + SMTP
#   docker compose up -d --build
#   docker compose exec app node server/dist/cli.js user:create --email you@example.com --name Milan --admin
#   docker compose exec worker node server/dist/cli.js crawl      # first crawl right away (otherwise 05:30)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kockolov
      POSTGRES_USER: kockolov
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kockolov -d kockolov"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Web app + API
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://kockolov:${POSTGRES_PASSWORD}@db:5432/kockolov
    depends_on:
      db:
        condition: service_healthy
    # Only reachable from the server itself; nginx in front serves the domain with HTTPS.
    # 3100 because Apache already uses 8080 on VestaCP/myVesta servers.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3100}:8080"

  # Scheduler: crawl at 05:30, morning e-mail at 07:00 (Europe/Belgrade)
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://kockolov:${POSTGRES_PASSWORD}@db:5432/kockolov
    command: ["node", "server/dist/worker.js"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
