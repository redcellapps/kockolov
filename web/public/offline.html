<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffcf00" />
    <meta name="robots" content="noindex" />
    <title>Nema interneta · Kockolov</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f4ee; --card: #ffffff; --ink: #16150f; --ink-2: #57544c; --line: #e7e3d8; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0f0f0e; --card: #1c1b19; --ink: #f5f3ec; --ink-2: #c4c0b5; --line: #2e2c28; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 32px 24px; text-align: center; }
      svg { width: 72px; height: 72px; }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { margin: 0 0 24px; color: var(--ink-2); }
      button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 12px 24px; background: #ffcf00; color: #16150f; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect x="4" y="18" width="48" height="36" rx="7" fill="#ffcf00" />
        <rect x="12" y="10" width="12" height="10" rx="3" fill="#ffcf00" />
        <rect x="32" y="10" width="12" height="10" rx="3" fill="#ffcf00" />
        <circle cx="44" cy="44" r="12" fill="#ffffff" stroke="#16150f" stroke-width="5" />
        <path d="M52.5 52.5 L60 60" stroke="#16150f" stroke-width="6" stroke-linecap="round" />
      </svg>
      <h1>Nema interneta</h1>
      <p>Kockolov proverava cene uživo, pa mu treba veza. Čim se telefon ponovo poveže, probaj još jednom.</p>
      <button type="button" onclick="location.reload()">Probaj ponovo</button>
    </main>
  </body>
</html>
