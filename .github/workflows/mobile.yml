name: Mobile apps

# Builds the Android app (an APK to install for testing) and checks that the iOS app compiles.
# Firebase settings for notifications come from repository secrets when they are set:
#   GOOGLE_SERVICES_JSON          contents of google-services.json (Android)
#   GOOGLE_SERVICE_INFO_PLIST     contents of GoogleService-Info.plist (iOS)
on:
  push:
    branches: [main, mobile]
    paths: ['mobile/**', 'web/**', 'package-lock.json', '.github/workflows/mobile.yml']
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - name: App pages
        run: npm run build:app -w web
      - name: Firebase settings
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > mobile/android/app/google-services.json
            echo "google-services.json added"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set: this build has no notifications"
          fi
      - run: npx cap sync android
        working-directory: mobile
      - name: Build (debug APK)
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: kockolov-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - name: App pages
        run: npm run build:app -w web
      - name: Firebase settings
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > mobile/ios/App/App/GoogleService-Info.plist
          fi
      - name: Sync (pod install)
        run: npx cap sync ios
        working-directory: mobile
      - name: Compile for iPhone (unsigned)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -n 40
          exit ${PIPESTATUS[0]}
