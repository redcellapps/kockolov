name: Mobile apps

# Builds the Android app (an APK to install for testing) and checks that the iOS app compiles.
# Run by hand with "Verzija za Google Play" ticked, it also builds the signed .aab to upload to Play Console
# (Releases → "android-play").
# Repository secrets:
#   GOOGLE_SERVICES_JSON          contents of google-services.json (Android notifications)
#   GOOGLE_SERVICE_INFO_PLIST     contents of GoogleService-Info.plist (iOS notifications)
#   ANDROID_KEYSTORE_BASE64       the upload key (.jks) as base64, for Google Play builds
#   ANDROID_KEYSTORE_PASSWORD     its password (also used for the key unless ANDROID_KEY_PASSWORD is set)
#   ANDROID_KEY_ALIAS             the key's alias (e.g. upload)
#   ANDROID_KEY_PASSWORD          optional, when the key has its own password
#   ASC_KEY_ID, ASC_ISSUER_ID     App Store Connect API key (Users and Access → Integrations → Team Keys, role Admin)
#   ASC_KEY_P8                    contents of that AuthKey_XXXX.p8 file
#   APPLE_TEAM_ID                 the 10-character Team ID (developer.apple.com → Membership details)
# Run by hand with "Verzija za App Store" ticked, the iOS job signs the app in the cloud and uploads it to
# App Store Connect, where it shows up in TestFlight (mobile/store/app-store.md).
on:
  push:
    branches: [main, mobile]
    paths: ['mobile/**', 'web/**', 'package-lock.json', '.github/workflows/mobile.yml']
  workflow_dispatch:
    inputs:
      play:
        description: Verzija za Google Play (potpisan .aab)
        type: boolean
        default: false
      appstore:
        description: Verzija za App Store (potpisan build u TestFlight)
        type: boolean
        default: false

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - name: App pages
        run: npm run build:app -w web
      - name: Firebase settings
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > mobile/android/app/google-services.json
            echo "google-services.json added"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set: this build has no notifications"
          fi
      - run: npx cap sync android
        working-directory: mobile
      # versionName from mobile/package.json; versionCode always higher than the last one (Play refuses repeats)
      - name: Version
        run: |
          echo "KOCKOLOV_VERSION_NAME=$(node -p "require('./mobile/package.json').version")" >> "$GITHUB_ENV"
          echo "KOCKOLOV_VERSION_CODE=$(( GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT ))" >> "$GITHUB_ENV"
      - name: Build (debug APK)
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: kockolov-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      # the APK straight on the phone: Releases → "android-test" → kockolov-test.apk (each build replaces it)
      - name: Test APK as a download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk kockolov-test.apk
          gh release view android-test >/dev/null 2>&1 || gh release create android-test --prerelease --target "$GITHUB_SHA" \
            --title "Kockolov za Android (probna verzija)" \
            --notes "Probna verzija za instalaciju na telefon (nije iz Google Play-a). Svaki novi build zamenjuje kockolov-test.apk."
          gh release upload android-test kockolov-test.apk --clobber

      # Google Play: Actions → Mobile apps → Run workflow → tick "Verzija za Google Play".
      # Every other run signs with a throwaway key, so a broken release build shows up before it's needed.
      - name: Upload key
        env:
          PLAY: ${{ github.event_name == 'workflow_dispatch' && inputs.play }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          key="$RUNNER_TEMP/upload.jks"
          if [ "$PLAY" = "true" ]; then
            if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
              echo "::error::Nedostaju secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD i ANDROID_KEY_ALIAS"
              exit 1
            fi
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$key"
            # a value pasted with a line break or spaces around it
            KEYSTORE_PASSWORD=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
            KEY_PASSWORD=$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')
            KEY_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d ' \r\n')
            # say what is wrong here, in the run's summary, instead of a long Gradle error later
            if ! list=$(keytool -list -keystore "$key" -storepass "$KEYSTORE_PASSWORD" 2>&1); then
              size=$(wc -c < "$key")
              if printf '%s' "$list" | grep -q -i 'EOFException'; then
                echo "::error::Ključ iz ANDROID_KEYSTORE_BASE64 je nepotpun (stiglo je $size bajtova): tekst nije kopiran ceo. Upiši ga ponovo, celog. Pravi kockolov-upload.jks ima oko 2.700 bajtova."
              else
                echo "::error::Ključ ne može da se otvori ($(printf '%s' "$list" | grep -m1 -i -E 'error|exception' | cut -c1-160); $size bajtova). Proveri ANDROID_KEYSTORE_PASSWORD i da je ANDROID_KEYSTORE_BASE64 ceo .jks fajl."
              fi
              exit 1
            fi
            if ! keytool -list -keystore "$key" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
              echo "::error::U ključu nema aliasa '$KEY_ALIAS'; ima: $(printf '%s' "$list" | grep -i 'PrivateKeyEntry' | cut -d, -f1 | tr '\n' ' '). Ispravi ANDROID_KEY_ALIAS."
              exit 1
            fi
          else
            KEYSTORE_PASSWORD=throwaway KEY_ALIAS=check KEY_PASSWORD=throwaway
            keytool -genkeypair -noprompt -keystore "$key" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Kockolov CI check"
          fi
          {
            echo "KOCKOLOV_KEYSTORE=$key"
            echo "KOCKOLOV_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KOCKOLOV_KEY_ALIAS=$KEY_ALIAS"
            echo "KOCKOLOV_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"
      - name: Build (signed AAB)
        run: |
          if ! ./gradlew bundleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            echo "::error::$(grep -m1 -E 'Failed to read key|Keystore was tampered|password was incorrect|What went wrong' -A2 "$RUNNER_TEMP/gradle.log" | tr '\n' ' ' | cut -c1-300)"
            exit 1
          fi
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep -q 'jar verified'
          # since 1.2 the release build goes through R8: an installable copy of exactly that code, for checking on a
          # phone before Play (throwaway key: uninstall the Play version first, or use a second phone)
          if [ "$PLAY" != "true" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/kockolov-test-r8.apk"
          fi
          rm -f "$KOCKOLOV_KEYSTORE"
        working-directory: mobile/android
        env:
          PLAY: ${{ github.event_name == 'workflow_dispatch' && inputs.play }}
      - name: R8 test APK as a download
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.play) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload android-test "$RUNNER_TEMP/kockolov-test-r8.apk" --clobber
      - name: AAB as a download
        if: github.event_name == 'workflow_dispatch' && inputs.play
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="kockolov-$KOCKOLOV_VERSION_NAME-$KOCKOLOV_VERSION_CODE.aab"
          cp mobile/android/app/build/outputs/bundle/release/app-release.aab "$name"
          gh release view android-play >/dev/null 2>&1 || gh release create android-play --prerelease --target "$GITHUB_SHA" \
            --title "Kockolov za Google Play" \
            --notes "Potpisan .aab za Play Console (Testiranje → Zatvoreno testiranje → Napravi novo izdanje). Svaki build zamenjuje prethodni fajl."
          for old in $(gh release view android-play --json assets --jq '.assets[].name | select(endswith(".aab"))'); do
            gh release delete-asset android-play "$old" --yes
          done
          gh release upload android-play "$name"
          echo "### $name (versionName $KOCKOLOV_VERSION_NAME, versionCode $KOCKOLOV_VERSION_CODE)" >> "$GITHUB_STEP_SUMMARY"

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Apple accepts only builds made with Xcode 26 (iOS 26 SDK): take the newest one on the runner
      - name: Xcode 26
        run: |
          x=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
          xcodebuild -version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: mobile
      - name: App pages
        run: npm run build:app -w web
      - name: Firebase settings
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > mobile/ios/App/App/GoogleService-Info.plist
          fi
      - name: Sync (pod install)
        run: npx cap sync ios
        working-directory: mobile
      - name: Compile for iPhone (unsigned)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -n 40
          exit ${PIPESTATUS[0]}
      # version from mobile/package.json (same as Android), build number always higher than the last one
      - name: App Store build → TestFlight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.appstore }}
        working-directory: mobile/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::Nedostaje secret $v (mobile/store/app-store.md)"; exit 1; fi
          done
          if [ ! -f App/GoogleService-Info.plist ]; then echo "::error::Nedostaje secret GOOGLE_SERVICE_INFO_PLIST (bez njega nema obaveštenja)"; exit 1; fi
          # signed for the App Store straight away: an "Apple Development" profile would need a registered iPhone
          version=$(node -p "require('../../package.json').version")
          build=$(( GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT ))
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then printf '%s\n' "$ASC_KEY_P8" > "$key"; else printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key"; fi
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Kockolov.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Distribution" \
            MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$build" \
            "${auth[@]}" archive | tail -n 60
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Kockolov.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" "${auth[@]}" | tail -n 40
          rm -f "$key"
          echo "### Kockolov $version ($build) poslat u App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "Za 10–30 min se pojavljuje u App Store Connect → TestFlight (posle Apple-ove automatske obrade)." >> "$GITHUB_STEP_SUMMARY"
